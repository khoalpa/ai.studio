[project]
name = "ai-story-spec"
version = "0.3.0"
description = "Canonical specification and workflow foundation for AI story packages"
requires-python = ">=3.10,<3.13"
dependencies = [
  "Pillow>=10,<13",
]

[project.optional-dependencies]
local-image = [
  "accelerate>=1.0,<2",
  "diffusers>=0.37,<1",
  "huggingface-hub>=0.34,<2",
  "safetensors>=0.4,<1",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "transformers>=4.45,<6",
]
cuda = [
  "accelerate>=1.0,<2",
  "diffusers>=0.37,<1",
  "huggingface-hub>=0.34,<2",
  "safetensors>=0.4,<1",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "transformers>=4.45,<6",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
ai-story = "ai_story.cli:main"

[build-system]
requires = ["setuptools>=68,<86"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_story = ["webapp/*.html", "webapp/*.css", "webapp/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["ai_story"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "artifacts/coverage/coverage.xml"

[tool.uv]
conflicts = [
  [
    { extra = "local-image" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "cuda" }]
torchvision = [{ index = "pytorch-cu130", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
