[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "audio-story-offline"
version = "0.0.0"
description = "Offline hybrid runtime for the Audio Story v3.16.13 contract"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
audio-story = "audio_story.cli:main"
audio-story-validate = "audio_story.validation.validate_story_runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_story"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/audio_story/persistence/migrations.py" = ["E501"]
"src/audio_story/workflows/*.py" = ["E501"]
"tests/integration/test_workflow_kernel.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=audio_story --cov-branch --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "gpu: requires local GPU hardware and is excluded from the default suite",
  "local_llm: explicit smoke test requiring a locally installed llama.cpp server",
  "local_ocr: explicit smoke test requiring pinned local Tesseract dependencies",
]

[tool.coverage.run]
source = ["audio_story"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
