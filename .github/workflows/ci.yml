name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install project
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test with branch coverage
        run: uv run pytest --cov=ai_story --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage XML
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: artifacts/coverage/coverage.xml
          if-no-files-found: error

  deterministic-smoke:
    name: Deterministic Stage 1-4 gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv sync --locked --group dev
      - name: Run repeatability gate
        run: >-
          uv run python tools/deterministic_smoke_gate.py
          --root artifacts/deterministic-smoke
          --evidence artifacts/deterministic-smoke-evidence.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-smoke-evidence
          path: artifacts/deterministic-smoke-evidence.json
          if-no-files-found: error

  cuda-lock:
    name: Locked CUDA environment resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify CUDA extra and lock without installing GPU packages
        run: uv sync --locked --extra cuda --dry-run
